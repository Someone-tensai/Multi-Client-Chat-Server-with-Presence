# ─────────────────────────────────────────────────────────────────────────────
# server.conf — runtime configuration for the Multi-Client Chat Server
#
# Lines starting with '#' are comments.  Format: key = value
# Any key not present retains its compile-time default.
# ─────────────────────────────────────────────────────────────────────────────

# ── Network ──────────────────────────────────────────────────────────────────
port = 8888

# ── Thread Pool ──────────────────────────────────────────────────────────────
thread_pool_size = 16
pool_min_threads  = 2
pool_shrink_idle_sec = 30

# ── Limits ───────────────────────────────────────────────────────────────────
max_clients  = 64
max_rooms    = 16
max_members  = 16
history_size = 10

# ── Rate Limiting (token bucket) ─────────────────────────────────────────────
rate_bucket_max  = 5
rate_refill_rate = 1.0
rate_msg_cost    = 1

# ── TLS (optional — leave defaults to run in plain-text) ─────────────────────
tls_cert = server.crt
tls_key  = server.key
